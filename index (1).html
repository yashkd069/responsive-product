<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Responsive Product Pricing Cards</title>
<style>
  :root {
    --bg: #f3f6fb;
    --card: #ffffff;
    --ink: #14213d;
    --muted: #5b6b86;
    --brand: #2563eb;
    --brand-dark: #1d4ed8;
    --accent: #f59e0b;
    --line: #dde4f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 56px 20px;
  }
  header { text-align: center; max-width: 560px; margin: 0 auto 32px; }
  header h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin-bottom: 10px; }
  header p { color: var(--muted); line-height: 1.5; }

  /* Billing toggle */
  .billing {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; margin-bottom: 48px; font-weight: 600;
  }
  .billing span { color: var(--muted); transition: color .25s; }
  .billing span.active { color: var(--ink); }
  .switch {
    position: relative; width: 56px; height: 30px;
    background: var(--brand); border: 0; border-radius: 30px; cursor: pointer;
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 24px; height: 24px; background: #fff; border-radius: 50%;
    transition: transform .3s ease;
  }
  .switch[aria-checked="true"]::after { transform: translateX(26px); }
  .switch:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .save-tag {
    background: #dcfce7; color: #166534; font-size: .75rem;
    padding: 3px 8px; border-radius: 20px;
  }

  /* Cards grid */
  .cards {
    max-width: 1060px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px;
    align-items: stretch;
  }
  .card {
    position: relative; overflow: hidden;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 36px 30px 30px;
    display: flex; flex-direction: column;
    transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
  }
  .card:hover {
    transform: translateY(-10px) scale(1.02);
    box-shadow: 0 22px 40px rgba(20, 33, 61, .15);
    border-color: var(--brand);
  }
  .card.featured { border: 2px solid var(--brand); }

  /* Ribbon badges */
  .ribbon {
    position: absolute; top: 20px; right: -42px;
    width: 150px; text-align: center; transform: rotate(45deg);
    font-size: .72rem; font-weight: 700; padding: 5px 0; color: #fff;
  }
  .ribbon.popular { background: var(--brand); }
  .ribbon.value { background: var(--accent); color: #3b2300; }

  .card h2 { font-size: 1.3rem; margin-bottom: 6px; }
  .card .desc { color: var(--muted); font-size: .92rem; margin-bottom: 22px; }
  .price { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; }
  .price .amount { font-size: 2.8rem; font-weight: 800; }
  .price .per { color: var(--muted); }
  .billed { color: var(--muted); font-size: .82rem; min-height: 1.2em; margin-bottom: 24px; }

  .features { list-style: none; margin-bottom: 30px; flex-grow: 1; }
  .features li {
    padding: 9px 0 9px 28px; position: relative;
    border-bottom: 1px solid var(--line); font-size: .95rem;
  }
  .features li::before {
    content: "✔"; position: absolute; left: 0; color: var(--brand); font-weight: 700;
  }

  .btn {
    display: block; width: 100%; padding: 14px; border-radius: 10px;
    border: 2px solid var(--brand); background: transparent; color: var(--brand);
    font-size: 1rem; font-weight: 700; cursor: pointer;
    transition: background .25s, color .25s, transform .15s;
  }
  .btn:hover { background: var(--brand); color: #fff; }
  .btn:active { transform: scale(.97); }
  .featured .btn { background: var(--brand); color: #fff; }
  .featured .btn:hover { background: var(--brand-dark); }

  /* Responsive */
  @media (max-width: 900px) {
    .cards { grid-template-columns: 1fr; max-width: 420px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <h1>Simple pricing for every team</h1>
  <p>Pick a plan that fits your needs. Switch to yearly billing to save more.</p>
</header>

<div class="billing">
  <span id="lblMonthly" class="active">Monthly</span>
  <button id="billingSwitch" class="switch" role="switch" aria-checked="false" aria-label="Switch between monthly and yearly billing"></button>
  <span id="lblYearly">Yearly <em class="save-tag" style="font-style:normal">Save 20%</em></span>
</div>

<main class="cards" id="cards"></main>

<script>
  // Plan data (monthly price; yearly price is per month, billed once a year)
  const plans = [
    {
      name: "Starter",
      desc: "For individuals getting started.",
      monthly: 9,
      yearly: 7,
      features: ["1 project", "5 GB storage", "Basic analytics", "Email support"],
      badge: null,
      featured: false
    },
    {
      name: "Pro",
      desc: "For growing teams that need more.",
      monthly: 29,
      yearly: 23,
      features: ["10 projects", "50 GB storage", "Advanced analytics", "Priority support"],
      badge: { text: "Popular", cls: "popular" },
      featured: true
    },
    {
      name: "Business",
      desc: "For companies that scale fast.",
      monthly: 59,
      yearly: 47,
      features: ["Unlimited projects", "500 GB storage", "Custom reports", "24/7 phone support"],
      badge: { text: "Best Value", cls: "value" },
      featured: false
    }
  ];

  const cardsEl = document.getElementById("cards");
  const switchEl = document.getElementById("billingSwitch");
  const lblMonthly = document.getElementById("lblMonthly");
  const lblYearly = document.getElementById("lblYearly");
  let yearly = false;

  function render() {
    cardsEl.innerHTML = plans.map(p => {
      const price = yearly ? p.yearly : p.monthly;
      const billed = yearly ? `Billed $${p.yearly * 12} per year` : "Billed monthly";
      return `
        <article class="card ${p.featured ? "featured" : ""}">
          ${p.badge ? `<div class="ribbon ${p.badge.cls}">${p.badge.text}</div>` : ""}
          <h2>${p.name}</h2>
          <p class="desc">${p.desc}</p>
          <div class="price"><span class="amount">$${price}</span><span class="per">/ month</span></div>
          <p class="billed">${billed}</p>
          <ul class="features">
            ${p.features.map(f => `<li>${f}</li>`).join("")}
          </ul>
          <button class="btn" onclick="choosePlan('${p.name}')">Choose ${p.name}</button>
        </article>`;
    }).join("");
  }

  function choosePlan(name) {
    alert(`You selected the ${name} plan (${yearly ? "Yearly" : "Monthly"} billing).`);
  }

  switchEl.addEventListener("click", () => {
    yearly = !yearly;
    switchEl.setAttribute("aria-checked", yearly);
    lblMonthly.classList.toggle("active", !yearly);
    lblYearly.classList.toggle("active", yearly);
    render();
  });

  render();
</script>
</body>
</html>
